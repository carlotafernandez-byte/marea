<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Marea</title>
  <meta name="description" content="Entiende tu ciclo, resuelve tus dudas y sabe cuándo preocuparte. Gratis, privada y sin anuncios." />
  <meta name="theme-color" content="#eef3fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060e1e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Marea" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 14c3 0 3-4 6-4s3 4 6 4 3-4 6-4" /></svg><span class="brand-name">Marea</span></div>
    <button class="icon-btn" data-action="settings" aria-label="Tu cuenta y ajustes">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
    </button>
  </header>
  <main id="app"></main>
  <nav class="tabs" aria-label="Secciones">
    <button data-tab="hoy"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 13c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3"/><path d="M2 19c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3"/><circle cx="12" cy="5" r="2"/></svg>Hoy</button>
    <button data-tab="ciclo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mi ciclo</button>
    <button class="add-tab" data-action="log-today" aria-label="Apuntar hoy"><span class="bubble"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Apuntar</button>
    <button data-tab="salud"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-8-4.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6.5-8 11-8 11z"/></svg>Salud</button>
    <button data-tab="pregunta"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg>Pregunta</button>
  </nav>
  <div id="sheet" class="sheet"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Necesitas activar JavaScript para usar Marea.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
